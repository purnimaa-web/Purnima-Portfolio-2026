<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resturant Point of Sale System</title>
</head>
<body>
    <h2>Resturant Point of Sale System</h2>
    Customer Name:
<input type="text" id="name" onkeyup="showName()">
<p id="customer">Customer:</p>
    <h3>Menu</h3>
    <button onclick="addItem('Burger',250)">Burger-250</button>
<button onclick="addItem('Pizza',800)">Pizza-800</button>
<button onclick="addItem('Fried Rice',350)">Fried Rice-350</button>
<button onclick="addItem('Coffee',120)">Coffee-120</button>
<button onclick="addItem('Soft Drink',50)">Soft Drink-50</button
    <h3>Order List</h3>
    <table border="1"cellpadding="8">
        <tr>
            <th>Item</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Remove</th>
        </tr>
        <tbody id="list"></tbody>
    </table>
    <h3>Subtotal:<span id="sub">0</span></h3>
    <h3>VAT(15%):<span id="vat">0</span></h3>
    <h3>Service Charge(5%):<span id="service">0</span></h3>
    <h3>Grand Total:<span id="grand">0</span></h3>
    <button onclick="window.print()">Print Invoice</button>
    <style>
           body {
        font-family: Arial, sans-serif;
        background: #f0f4f8;
        text-align: center;
        padding: 20px;
    }

    h2 {
        color: #1565c0;
    }

    button {
        background: #00897b;
        color: white;
        border: none;
        padding: 10px 15px;
        margin: 5px;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #00574b;
    }

    table {
        margin: 15px auto;
        width: 90%;
        border-collapse: collapse;
        background: white;
    }

    th {
        background: #1565c0;
        color: white;
    }

    th, td {
        padding: 10px;
        border: 1px solid #ddd;
    }

    input {
        padding: 7px;
        border: 1px solid #aaa;
        border-radius: 4px;
    }

    h3, h2 {
        margin: 15px;
    }

    #grand {
        color: #00897b;
        font-weight: bold;
    }

    @media print {
        button, input {
            display: none;
        }

        body {
            background: white;
        }
    }
    </style>
    <script>
let order = [];

function addItem(name, price) {
    let found = false;

    for (let i = 0; i < order.length; i++) {
        if (order[i].name === name) {
            order[i].qty++;
            found = true;
            break;
        }
    }

    if (!found) {
        order.push({
            name: name,
            price: price,
            qty: 1
        });
    }

    display();
}

function display() {
    let html = "";
    let subtotal = 0;

    for (let i = 0; i < order.length; i++) {
        let item = order[i];
        let total = item.price * item.qty;
        subtotal += total;

        html += "<tr>";
        html += "<td>" + item.name + "</td>";
        html += "<td>" + item.price + "</td>";
        html += "<td><input type='number' min='1' value='" +
            item.qty + "' onchange='changeQty(" + i +
            ", this.value)'></td>";
        html += "<td>" + total + "</td>";
        html += "<td><button onclick='removeItem(" + i +
            ")'>Remove</button></td>";
        html += "</tr>";
    }

    document.getElementById("list").innerHTML = html;

    let vat = subtotal * 0.15;
    let service = subtotal * 0.05;

    document.getElementById("sub").innerText =
        subtotal.toFixed(2);

    document.getElementById("vat").innerText =
        vat.toFixed(2);

    document.getElementById("service").innerText =
        service.toFixed(2);

    document.getElementById("grand").innerText =
        (subtotal + vat + service).toFixed(2);
}

function changeQty(i, qty) {
    qty = Number(qty);

    if (Number.isInteger(qty) && qty >= 1) {
        order[i].qty = qty;
    } else {
        alert("Enter quantity 1 or more");
    }

    display();
}

function removeItem(i) {
    order.splice(i, 1);
    display();
}

function showName() {
    document.getElementById("customer").innerText =
        "Customer: " +
        document.getElementById("name").value;
}
</script>
   
    
</body>
</html>
